name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Validate property lists
        run: |
          plutil -lint Config/Info.plist
          plutil -lint Config/Startle.entitlements
          plutil -lint Sources/StartleApp/Resources/PrivacyInfo.xcprivacy

      - name: Check Swift formatting
        run: xcrun swift-format lint --recursive --strict Sources Tests Package.swift

      - name: Run release-mode package tests
        run: swift test -c release -Xswiftc -warnings-as-errors

      - name: Run Xcode tests
        run: |
          xcodebuild \
            -project Startle.xcodeproj \
            -scheme Startle \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test

      - name: Build release app
        run: |
          xcodebuild \
            -project Startle.xcodeproj \
            -scheme Startle \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            build

      - name: Verify release bundle
        run: ./Scripts/verify-unsigned-build.sh build/DerivedData/Build/Products/Release/Startle.app
